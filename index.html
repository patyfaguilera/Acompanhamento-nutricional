<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Aileron', Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #662e39;
    line-height: 1.6;
    font-size: 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 22px 56px; }

  /* Capa */
  #capa { text-align: center; }
  #capa img {

    border-radius: 18px; margin: 0 auto 24px; display: block;
  }
  .selo {
    display: inline-block; background: #662e39; color: #ffffff;
    padding: 8px 16px; border-radius: 999px; font-size: 12px;
    font-weight: 700; letter-spacing: 1px; margin-bottom: 18px;
  }
  #capa h1 { font-size: 34px; line-height: 1.15; margin: 0 0 14px; font-weight: 900; }
  #capa .sub { font-size: 18px; font-style: italic; margin: 0 0 14px; }
  #capa .texto { margin: 0 auto 28px; max-width: 540px; }

  .btn {
    background: #662e39; color: #ffffff; border: none;
    border-radius: 999px; padding: 14px 28px; font-family: inherit;
    font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .btn:hover { opacity: .9; }
  .btn-sec {
    background: #ffffff; color: #662e39; border: 2px solid #662e39;
    border-radius: 999px; padding: 10px 20px; font-family: inherit;
    font-weight: 700; cursor: pointer;
  }
  .btn-sec:hover { background: #f6f4b5; }
  .btn-sec:disabled { opacity: .3; cursor: default; background: #ffffff; }

  /* Visualizador */
  #viewer { display: none; }
  .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; }
  .contador { font-size: 13px; font-weight: 700; }
  .barra { height: 8px; background: #f6f4b5; border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
  .barra div { height: 100%; background: #662e39; transition: width .3s; }

  .etapa-titulo {
    background: #662e39; color: #ffffff; border-radius: 18px;
    padding: 24px 26px; margin-bottom: 22px;
  }
  .etapa-titulo .num { color: #f6f4b5; font-weight: 700; font-size: 14px; }
  .etapa-titulo h2 { margin: 6px 0 8px; font-size: 26px; line-height: 1.2; font-weight: 900; }
  .etapa-titulo p { margin: 0; font-style: italic; color: #f6f4b5; }

  .corpo p { margin: 0 0 12px; }
  .corpo ul { margin: 6px 0 16px; padding-left: 22px; }
  .corpo li { margin-bottom: 6px; }
  .destaque {
    background: #f6f4b5; border-left: 6px solid #662e39;
    border-radius: 12px; padding: 14px 18px; margin: 18px 0; font-weight: 700;
  }

  .plano {
    border: 2px solid #662e39; border-radius: 16px; padding: 20px;
    margin-bottom: 16px; background: #ffffff;
  }
  .plano.destaque-plano { background: #f6f4b5; }
  .plano .tag {
    display: inline-block; background: #662e39; color: #ffffff;
    border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; margin-bottom: 10px;
  }
  .plano h3 { margin: 0 0 6px; font-size: 19px; font-weight: 800; }
  .plano p { margin: 0 0 10px; }
  .valor { font-size: 22px; font-weight: 900; margin-top: 6px; }

  .navegacao { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; border-top: 2px solid #f6f4b5; padding-top: 18px; }
  .fim { text-align: center; margin-top: 30px; }
  .fim p { margin: 0 0 16px; font-size: 18px; font-weight: 700; }

  @media (max-width: 560px) {
    #capa h1 { font-size: 28px; }

let atual = 0;

function abrirViewer() {
  document.getElementById('capa').style.display = 'none';
  document.getElementById('viewer').style.display = 'block';
  mostrar(0);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function voltarInicio() {
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('capa').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function mostrar(i) {
  atual = i;
  const e = etapas[i];
  const total = etapas.length;
  document.getElementById('contador').textContent = `Etapa ${i + 1} de ${total}`;
  document.getElementById('progresso').style.width = `${((i + 1) / total) * 100}%`;
  document.getElementById('conteudo').innerHTML = `
    <div class="etapa-titulo">
      <span class="num">${String(i + 1).padStart(2, '0')}</span>
      <h2>${e.titulo}</h2>
      <p>${e.resumo}</p>
    </div>
    ${e.html}
  `;
  document.getElementById('btn-anterior').disabled = i === 0;
  document.getElementById('btn-proximo').disabled = i === total - 1;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('btn-abrir').addEventListener('click', abrirViewer);
document.getElementById('btn-inicio').addEventListener('click', voltarInicio);
document.getElementById('btn-anterior').addEventListener('click', () => { if (atual > 0) mostrar(atual - 1); });
document.getElementById('btn-proximo').addEventListener('click', () => { if (atual < etapas.length - 1) mostrar(atual + 1); });
